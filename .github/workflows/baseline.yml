# Reusable workflow: language-independent required checks for every repo.
# Jobs: full-history secret scan (gitleaks), AI-vendor-file ban, and
# dependency review on pull requests to public repos.
name: baseline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  vendor-files:
    name: vendor-files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject AI-vendor-specific files (AGENTS.md is the only AI guidance file)
        run: |
          set -euo pipefail
          banned='(^|/)(claude\.md|\.claude/|gemini\.md|\.gemini/|\.cursor/|\.cursorrules|\.aider|\.windsurfrules|\.clinerules)|^\.github/copilot-instructions\.md$'
          if found=$(git ls-files | grep -iE "$banned"); then
            echo "::error::AI-vendor-specific files are not allowed; put AI guidance in AGENTS.md:"
            echo "$found"
            exit 1
          fi

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
